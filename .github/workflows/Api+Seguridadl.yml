name: CI Pipeline – API + Seguridad + Reports Web

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 13 * * *'  # Ejecuta todos los días a la 1 PM UTC
  workflow_dispatch:       # Permite ejecución manual

jobs:
  # ===============================
  # JOB 1: Tests de API con Newman
  # ===============================
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # Descargar repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Instalar Newman y reporter HTML
      - name: Instalar Newman
        run: npm install -g newman newman-reporter-htmlextra

      # Crear carpeta para reportes Newman
      - name: Crear carpeta Newman
        run: mkdir -p newman

      # Ejecutar colección Postman
      - name: Ejecutar colección Postman
        run: |
          newman run newman/EC-Carga.postman_collection.json \
            -e newman/Prueba.postman_environment.json \
            -d newman/DataPruebaDog.csv \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman/report.html || true

      # Verificar archivos generados
      - name: Listar archivos Newman
        run: ls -R newman

      # Subir reporte Newman como artefacto
      - name: Subir reporte Newman
        uses: actions/upload-artifact@v4
        with:
          name: postman-report
          path: newman

      # Preparar carpeta para GitHub Pages
      - name: Preparar carpeta Pages
        run: |
          mkdir -p gh-pages
          cp newman/report.html gh-pages/postman_report.html

  # ===============================
  # JOB 2: Escaneo de seguridad ZAP
  # ===============================
  zap-scan:
    runs-on: ubuntu-latest
    needs: run-tests

    steps:
      # Descargar repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar Docker
      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      # Crear carpeta dedicada para reportes ZAP
      - name: Crear carpeta reportes ZAP
        run: mkdir -p ${{ github.workspace }}/zap-reports

      # Ejecutar ZAP API Scan (reportes en carpeta segura)
      - name: Ejecutar ZAP API Scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/zap-reports:/zap/wrk:rw \
            -t ictu/zap2docker-weekly \
            zap-api-scan.py \
            -t https://petstore.swagger.io/v2/pet/findByStatus?status=available \
            -f openapi \
            -r /zap/wrk/zap_report.html \
            -j /zap/wrk/zap_report.json \
            -T 30 \
            -I || true  # Ignora WARNs

      # Verificar que los reportes ZAP se generaron
      - name: Verificar reportes ZAP
        run: |
          ls -l ${{ github.workspace }}/zap-reports
          if [ -f ${{ github.workspace }}/zap-reports/zap_report.html ]; then echo "HTML generado"; else echo "HTML NO generado"; fi
          if [ -f ${{ github.workspace }}/zap-reports/zap_report.json ]; then echo "JSON generado"; else echo "JSON NO generado"; fi

      # Falla solo si hay HIGH vulnerabilities
      - name: Fallar solo si HIGH
        run: |
          if [ -f ${{ github.workspace }}/zap-reports/zap_report.json ]; then
            cat ${{ github.workspace }}/zap-reports/zap_report.json | jq '.site[].alerts[] | select(.risk=="High")' > high_alerts.json
            if [ -s high_alerts.json ]; then
              echo "❌ HIGH vulnerabilities detectadas!"
              exit 1
            else
              echo "✅ No hay HIGH vulnerabilities"
            fi
          else
            echo "⚠️ zap_report.json no existe, saltando verificación HIGH"
          fi

      # Subir reportes ZAP como artefactos
      - name: Subir reporte ZAP
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: |
            ${{ github.workspace }}/zap-reports/zap_report.html
            ${{ github.workspace }}/zap-reports/zap_report.json

      # Copiar HTML ZAP a carpeta Pages
      - name: Preparar carpeta Pages
        run: cp ${{ github.workspace }}/zap-reports/zap_report.html gh-pages/zap_report.html

  # ===============================
  # JOB 3: Publicación GitHub Pages
  # ===============================
  publish-pages:
    runs-on: ubuntu-latest
    needs: [run-tests, zap-scan]

    steps:
      # Descargar repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar Pages
      - name: Configurar Pages
        uses: actions/configure-pages@v4

      # Subir carpeta gh-pages como artefacto
      - name: Subir artefacto Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: gh-pages

      # Desplegar Pages
      - name: Desplegar Pages
        uses: actions/deploy-pages@v1
