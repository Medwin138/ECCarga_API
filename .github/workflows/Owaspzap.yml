name: Run OWASP ZAP Scan

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 13 * * *'  # Ejecuta todos los días a la 1 PM UTC (8 AM en Colombia)
  workflow_dispatch:  # Permite ejecutar el workflow manualmente desde GitHub Actions

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Docker
        uses: docker/setup-buildx-action@v2

      - name: Run OWASP ZAP Scan
        run: |
          docker run --rm --memory=8gb -v $(pwd):/zap/wrk/:rw -t ictu/zap2docker-weekly \
          zap-full-scan.py -I -j -m 10 -T 60 \
          -t https://petstore.swagger.io/v2/pet/findByStatus?status=available \
          -r zap_report.html
        env:
          ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}  # Si es necesario usar una clave API

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap_report.html
