name: OWASP ZAP Full Scan

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 13 * * *'  # Ejecuta todos los días a la 1 PM UTC, que corresponde a las 8 AM en Colombia
  workflow_dispatch:  # Permite ejecutar el workflow manualmente desde GitHub Actions

jobs:
  zap-full-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Run ZAP Full Scan
        run: |
          docker run --rm --memory=8gb -v $(pwd):/zap/wrk/:rw -t ictu/zap2docker-weekly \
          zap-full-scan.py -I -j -m 10 -T 60 \
          -t https://petstore.swagger.io/v2/pet/findByStatus?status=available \
          -r zap_report.html

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v2
        with:
          name: zap-report
          path: zap_report.html
