name: Run OWASP ZAP Scan  # Escaneo de seguridad con ZAP

on:
  push:
    branches:
      - main  # Ejecuta al hacer push a main

  schedule:
    - cron: '0 13 * * *'  # Ejecuta diario a las 13:00 UTC (8 AM Colombia)

  workflow_dispatch:  # Permite ejecución manual

jobs:
  zap-scan:

    runs-on: ubuntu-latest  # Runner Linux de GitHub

    steps:

      # Descarga el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Habilita Docker
      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      # Ejecuta escaneo rápido de la API
      # || true evita que el job falle por warnings
      - name: Ejecutar OWASP ZAP
        run: |
          docker run --rm \
          -v $(pwd):/zap/wrk/:rw \
          -t ictu/zap2docker-weekly \
          zap-api-scan.py \
          -t https://petstore.swagger.io/v2/pet/findByStatus?status=available \
          -f openapi \           # Tipo de API (OpenAPI/Swagger)
          -r zap_report.html \   # Reporte HTML
          -T 30 || true          # Tiempo máximo y no falla por warnings

      # Muestra los archivos generados (útil para debugging)
      - name: Listar archivos generados
        run: ls -R

      # Sube el reporte como artefacto descargable
      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report  # Nombre del artefacto
          path: zap_report.html      # Archivo del reporte
