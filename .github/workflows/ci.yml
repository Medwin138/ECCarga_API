name: Run Postman Tests

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 13 * * *'  # Ejecuta todos los días a la 1 PM UTC, que corresponde a las 8 AM en Colombia
  workflow_dispatch:  # Permite ejecutar el workflow manualmente desde GitHub Actions

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'  # Actualiza a Node.js versión 18 o superior

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection
        run: |
          newman run EC-Carga.postman_collection.json \
            -e Prueba.postman_environment.json \
            -d DataPruebaDog.csv \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman/report.html

      - name: Upload report
        uses: actions/upload-artifact@v2
        with:
          name: postman-report
          path: newman/report.html
