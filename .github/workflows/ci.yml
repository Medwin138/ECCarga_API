name: Run Postman Tests

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman and reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Create newman directory
        run: mkdir -p newman

      - name: Run Postman Collection
        run: |
          newman run newman/EC-Carga.postman_collection.json \
            -e newman/Prueba.postman_environment.json \
            -d newman/DataPruebaDog.csv \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman/report.html || true

      - name: List files in directory
        run: ls -R newman

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: postman-report
          path: newman
