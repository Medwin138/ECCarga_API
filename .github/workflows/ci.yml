name: Run Postman Tests

on:
  schedule:
    - cron: '0 0 * * *'  # Ejecuta todos los días a medianoche UTC
  workflow_dispatch:  # Permite ejecutar el workflow manualmente desde GitHub Actions

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection
        run: newman run <path_to_your_collection.json> --reporters cli,html --reporter-html-export report.html

      - name: Send Email Notification
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          curl --request POST \
          --url https://api.sendgrid.com/v3/mail/send \
          --header "Authorization: Bearer $SENDGRID_API_KEY" \
          --header 'Content-Type: application/json' \
          --data '{"personalizations": [{"to": [{"email": "tu_correo@example.com"}]}],"from": {"email": "notificaciones@tu_dominio.com"},"subject": "Resultado de las Pruebas Automatizadas","content": [{"type": "text/plain", "value": "Las pruebas se han ejecutado. Revisa los resultados en el reporte adjunto."}]}'

      - name: Upload report
        uses: actions/upload-artifact@v2
        with:
          name: postman-report
          path: report.html
